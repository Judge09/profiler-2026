<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROFILER — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-text">PROFILER</div>
      <div class="logo-sub">OSINT &amp; SOCMINT Intelligence</div>
    </div>

    {% if error %}
    <div class="alert alert-danger mb-3">
      <i class="fa fa-triangle-exclamation me-2"></i>{{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="mb-3">
        <label class="form-label">ACCESS CODE</label>
        <div class="position-relative">
          <input type="password" name="password" class="form-control"
                 placeholder="Enter password" autofocus autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 mt-2" style="padding: 10px;">
        <i class="fa fa-unlock me-2"></i>AUTHENTICATE
      </button>
    </form>

    <div class="text-center mt-4" style="font-size: 10px; color: var(--text-faint); letter-spacing: 1px;">
      LOCAL ACCESS ONLY &nbsp;·&nbsp; 127.0.0.1
    </div>
  </div>
</div>
</body>
</html>
