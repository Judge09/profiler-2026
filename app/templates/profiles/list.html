{% extends "base.html" %}
{% block title %}Profiles — PROFILER{% endblock %}

{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div>
    <div class="page-title">Profile <span>Dossiers</span></div>
    <div class="page-subtitle" id="profileCount">…</div>
  </div>
  <div class="d-flex gap-2">
    <a href="{{ url_for('profiles.new_profile') }}" class="btn btn-primary">
      <i class="fa fa-plus"></i> New Profile
    </a>
    <button class="btn btn-ghost" data-bs-toggle="modal" data-bs-target="#tagModal">
      <i class="fa fa-tags"></i> Tags
    </button>
  </div>
</div>

<div class="page-body">
  <div class="d-flex gap-3 mb-4 align-items-center flex-wrap">
    <div class="search-bar">
      <i class="fa fa-search search-icon"></i>
      <input type="text" id="q" class="form-control"
             placeholder="Search codename, name…" style="width:240px;">
    </div>

    <select class="sort-select" id="sortSel">
      <option value="date">Sort: Latest</option>
      <option value="name">Sort: A–Z</option>
      <option value="threat">Sort: Threat ↓</option>
    </select>

    <div class="d-flex gap-2 flex-wrap" id="tagPills"></div>
  </div>

  <div id="profileList"><div class="mon-empty">Loading profiles…</div></div>
</div>

<!-- Tag manager -->
<div class="modal fade" id="tagModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="background:var(--bg-card);border:1px solid var(--border)">
      <div class="modal-header" style="border-color:var(--border)">
        <h5 class="modal-title">Tags</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex gap-2 mb-3">
          <input class="form-control form-control-sm" id="newTagName" placeholder="Tag name">
          <input type="color" class="form-control form-control-sm" id="newTagColor"
                 value="#00ff99" style="width:52px;padding:3px">
          <button class="btn btn-primary btn-sm" id="addTagBtn">Add</button>
        </div>
        <div id="tagList"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
/* Profiles live in this browser (IndexedDB). Searching, sorting and tag
   filtering all happen here — there is no server-side list to query. */
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

  const state = { q: '', sort: 'date', tag: null };
  // Object URLs for photos must be released or they leak for the page's life.
  let photoUrls = [];

  function releasePhotos() {
    photoUrls.forEach((u) => URL.revokeObjectURL(u));
    photoUrls = [];
  }

  async function card(p, tagsById) {
    let photo = '<div class="profile-card-photo-placeholder"><i class="fa fa-user"></i></div>';
    if (p.photo_id) {
      const url = await Data.photoUrl(p.photo_id);
      if (url) {
        photoUrls.push(url);
        photo = '<img src="' + url + '" class="profile-card-photo" alt="">';
      }
    }

    const radar = p.radar || {};
    const scores = radar.scores || [];
    const threat = scores[4] || 0;
    const threatLabel = (radar.labels || [])[4] || 'Threat';

    const pills = (p.tag_ids || []).map((id) => tagsById[id]).filter(Boolean)
      .map((t) => '<span class="tag-chip" style="border-color:' + esc(t.color) +
        ';color:' + esc(t.color) + '">' + esc(t.name) + '</span>').join('');

    return '<a href="/profiles/' + p.id + '" class="profile-card">' + photo +
      '<div class="profile-card-info">' +
      '<div class="profile-card-codename">' + esc(p.codename) + '</div>' +
      (p.real_name ? '<div class="profile-card-realname">' + esc(p.real_name) + '</div>' : '') +
      '<div class="d-flex align-items-center gap-2 mt-2">' +
        '<span style="font-size:10px;color:var(--text-faint)">' +
        esc(String(threatLabel).toUpperCase()) + '</span>' +
        '<div class="threat-bar"><span style="width:' + Math.max(0, Math.min(100, threat)) +
        '%"></span></div>' +
        '<span style="font-size:11px;font-family:var(--font-mono);color:var(--text-dim)">' +
        threat + '</span>' +
      '</div>' +
      (pills ? '<div class="d-flex gap-1 flex-wrap mt-2">' + pills + '</div>' : '') +
      '</div></a>';
  }

  async function render() {
    releasePhotos();
    const [profiles, tags] = await Promise.all([Data.profiles(), Data.tags()]);
    const tagsById = Object.fromEntries(tags.map((t) => [t.id, t]));

    $('#profileCount').textContent = profiles.length +
      ' subject' + (profiles.length === 1 ? '' : 's') + ' in this browser';

    $('#tagPills').innerHTML =
      '<button class="dork-pill' + (state.tag ? '' : ' active') + '" data-tag="">All</button>' +
      tags.map((t) => '<button class="dork-pill' +
        (state.tag === t.id ? ' active' : '') + '" data-tag="' + t.id + '"' +
        (state.tag === t.id ? ' style="border-color:' + esc(t.color) + ';color:' + esc(t.color) + '"' : '') +
        '>' + esc(t.name) + '</button>').join('');

    let rows = profiles;
    if (state.q) {
      const needle = state.q.toLowerCase();
      rows = rows.filter((p) =>
        (p.codename + ' ' + (p.real_name || '') + ' ' +
         (p.known_aliases || []).join(' ')).toLowerCase().includes(needle));
    }
    if (state.tag) rows = rows.filter((p) => (p.tag_ids || []).includes(state.tag));

    const threatOf = (p) => ((p.radar || {}).scores || [])[4] || 0;
    rows.sort({
      name: (a, b) => String(a.codename).localeCompare(String(b.codename)),
      threat: (a, b) => threatOf(b) - threatOf(a),
      date: (a, b) => String(b.created_at).localeCompare(String(a.created_at)),
    }[state.sort]);

    const host = $('#profileList');
    if (!rows.length) {
      host.innerHTML = '<div class="mon-empty">' +
        (profiles.length
          ? 'No profiles match this view.'
          : '<i class="fa fa-id-card fa-2x mb-3 d-block" style="opacity:.3"></i>' +
            '<p class="mb-1">No profiles yet.</p>' +
            '<p style="font-size:12px">A profile is a dossier on one subject: ' +
            'identity, aliases, social accounts and intel notes.</p>' +
            '<a class="btn btn-primary btn-sm mt-2" href="/profiles/new">' +
            'Create the first profile</a>') + '</div>';
      return;
    }
    host.innerHTML = '<div class="profile-grid">' +
      (await Promise.all(rows.map((p) => card(p, tagsById)))).join('') + '</div>';
  }

  async function renderTags() {
    const tags = await Data.tags();
    const profiles = await Data.profiles();
    $('#tagList').innerHTML = tags.length ? tags.map((t) => {
      const used = profiles.filter((p) => (p.tag_ids || []).includes(t.id)).length;
      return '<div class="d-flex align-items-center gap-2 mb-2">' +
        '<span class="tag-chip" style="border-color:' + esc(t.color) + ';color:' +
        esc(t.color) + '">' + esc(t.name) + '</span>' +
        '<span style="font-size:11px;color:var(--text-faint)">' + used + ' profile(s)</span>' +
        '<button class="btn btn-danger btn-xs ms-auto" data-deltag="' + t.id +
        '"><i class="fa fa-trash"></i></button></div>';
    }).join('') : '<p class="mon-note mb-0">No tags yet.</p>';
  }

  $('#q').addEventListener('input', debounce((e) => {
    state.q = e.target.value.trim();
    render();
  }, 200));
  $('#sortSel').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
  $('#tagPills').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tag]');
    if (!b) return;
    state.tag = b.dataset.tag ? Number(b.dataset.tag) : null;
    render();
  });

  $('#addTagBtn').addEventListener('click', async () => {
    const name = $('#newTagName').value.trim();
    if (!name) return;
    try {
      await Data.addTag(name, $('#newTagColor').value);
      $('#newTagName').value = '';
      await renderTags();
      await render();
      showToast('Tag added', 'success');
    } catch (e) { showToast(e.message, 'danger'); }
  });

  $('#tagList').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-deltag]');
    if (!b) return;
    if (!await confirmModal('Delete this tag? It is removed from every profile ' +
        'that carries it.', 'Delete')) return;
    await Data.deleteTag(Number(b.dataset.deltag));
    await renderTags();
    await render();
    showToast('Tag deleted', 'success');
  });

  document.getElementById('tagModal').addEventListener('show.bs.modal', renderTags);
  window.addEventListener('pagehide', releasePhotos);

  render().catch((e) => {
    document.getElementById('profileList').innerHTML =
      '<div class="mon-empty">Could not read this browser&#39;s storage. ' +
      esc(e.message) + '</div>';
  });
})();
</script>
{% endblock %}
