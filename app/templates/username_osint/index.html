{% extends "base.html" %}
{% block title %}Username OSINT — PROFILER{% endblock %}

{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div>
    <div class="page-title">Username <span>OSINT</span></div>
    <div class="page-subtitle">Check a username across {{ platform_count }} platforms in real-time</div>
  </div>
</div>

<div class="page-body">

  <!-- Search form -->
  <div class="card mb-4">
    <form id="usernameForm">
      <div class="row g-3 align-items-end">
        <div class="col-md-5">
          <label class="form-label">Username to Search</label>
          <input type="text" id="usernameInput" class="form-control mono"
                 placeholder="e.g. johndoe99" autocomplete="off">
        </div>
        <div class="col-md-3">
          <label class="form-label">Link Results to Profile</label>
          <select id="saveProfileSelect" class="form-select">
            <option value="">— None —</option>
            
          </select>
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-primary" id="searchBtn">
            <i class="fa fa-magnifying-glass"></i> Search
          </button>
          <button type="button" class="btn btn-ghost ms-2" id="cancelBtn" style="display:none;" onclick="cancelScan()">
            <i class="fa fa-stop"></i> Cancel
          </button>
          <button type="button" class="btn btn-outline ms-2" id="saveToProfBtn" style="display:none;">
            <i class="fa fa-save"></i> Save to Profile
          </button>
          <button type="button" class="btn btn-ghost ms-2" id="exportCsvBtn" style="display:none;" onclick="exportCSV()">
            <i class="fa fa-file-csv"></i> Export CSV
          </button>
        </div>
      </div>
    </form>

    <!-- Progress -->
    <div class="mt-3">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <span style="font-size:11px; color:var(--text-faint);" id="osintProgressTxt"></span>
        <span style="font-size:12px;" id="osintStats"></span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="osintProgress" style="width:0%"></div>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="resultsWrap" style="display:none;">
    <div class="card">
      <div class="card-header-bar">
        <div class="card-title"><i class="fa fa-list me-2"></i>Results</div>
        <div class="d-flex gap-2">
          <button class="btn btn-xs osint-filter-btn active" data-filter="all">All</button>
          <button class="btn btn-xs osint-filter-btn" data-filter="found"
                  style="color:var(--green); border-color:var(--green);">Found</button>
          <button class="btn btn-xs osint-filter-btn" data-filter="not_found"
                  style="color:var(--text-faint);">Not Found</button>
          <button class="btn btn-xs osint-filter-btn" data-filter="error"
                  style="color:var(--red); border-color:var(--red);">Error</button>
        </div>
      </div>

      <div style="overflow-x:auto;">
        <table class="osint-table">
          <thead>
            <tr>
              <th style="width:140px;">Platform</th>
              <th style="width:100px;">Status</th>
              <th style="width:60px;">HTTP</th>
              <th>URL</th>
              <th style="width:36px;"></th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/username_check.js') }}"></script>
{% endblock %}
