{% extends "base.html" %}
{% block title %}Link Maps — PROFILER{% endblock %}

{% block content %}
<div class="page-header d-flex align-items-center justify-content-between">
  <div>
    <div class="page-title">Link <span>Mapper</span></div>
    <div class="page-subtitle">Visual node-graph intelligence mapping</div>
  </div>
  <button class="btn btn-primary" id="btnNewMap">
    <i class="fa fa-plus"></i> New Map
  </button>
</div>

<div class="page-body">
  <div id="mapList"><div class="mon-empty">Loading maps…</div></div>
</div>

{% endblock %}

{% block scripts %}
<script>
/* Maps live in this browser (IndexedDB), like every other record. */
(function () {
  'use strict';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  document.getElementById('btnNewMap').addEventListener('click', async () => {
    const id = await Store.put('graphs', {
      title: 'Untitled Map', profile_id: null,
      graph_json: '{"nodes":[],"edges":[]}',
      created_at: new Date().toISOString().slice(0, 19),
      updated_at: new Date().toISOString().slice(0, 19),
    });
    window.location = '/linkmap/edit?id=' + id;
  });

  async function render() {
    const graphs = (await Store.all('graphs'))
      .sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at)));
    const profiles = await Store.all('profiles');
    const byId = Object.fromEntries(profiles.map((p) => [p.id, p.codename]));
    const host = document.getElementById('mapList');

    if (!graphs.length) {
      host.innerHTML = '<div class="mon-empty">' +
        '<i class="fa fa-diagram-project fa-2x mb-3 d-block" style="opacity:.3"></i>' +
        '<p class="mb-1">No maps yet.</p>' +
        '<p style="font-size:12px">Build one from a watch, or start an empty map.</p>' +
        '</div>';
      return;
    }

    host.innerHTML = '<div class="profile-grid">' + graphs.map((g) => {
      let n = 0, e = 0;
      try {
        const parsed = JSON.parse(g.graph_json || '{}');
        n = (parsed.nodes || []).length;
        e = (parsed.edges || []).length;
      } catch (err) { /* a corrupt map still lists, just without counts */ }
      return '<div class="card" style="position:relative">' +
        '<div style="font-size:15px;font-weight:700;color:#fff;margin-bottom:6px;' +
        'font-family:var(--font-mono)">' + esc(g.title) + '</div>' +
        (g.profile_id && byId[g.profile_id]
          ? '<div style="font-size:11px;color:var(--text-dim);margin-bottom:10px">' +
            '<i class="fa fa-id-card me-1"></i>' + esc(byId[g.profile_id]) + '</div>' : '') +
        '<div style="font-size:10px;color:var(--text-faint)">' +
        n + ' nodes · ' + e + ' edges · updated ' +
        esc((g.updated_at || '').replace('T', ' ').slice(0, 16) || '—') + '</div>' +
        '<div class="d-flex gap-2 mt-3">' +
        '<a href="/linkmap/edit?id=' + g.id + '" class="btn btn-outline btn-sm">' +
        '<i class="fa fa-pen"></i> Open</a>' +
        '<button class="btn btn-danger btn-sm" data-del="' + g.id + '">' +
        '<i class="fa fa-trash"></i></button></div></div>';
    }).join('') + '</div>';

    host.querySelectorAll('[data-del]').forEach((b) => {
      b.addEventListener('click', async () => {
        if (!await confirmModal('Delete this map?', 'Delete')) return;
        await Store.remove('graphs', Number(b.dataset.del));
        showToast('Map deleted', 'success');
        render();
      });
    });
  }

  render().catch((e) => {
    document.getElementById('mapList').innerHTML =
      '<div class="mon-empty">Could not read this browser&#39;s storage. ' +
      esc(e.message) + '</div>';
  });
})();
</script>
{% endblock %}
